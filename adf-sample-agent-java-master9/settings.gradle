plugins {
  id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'adf-sample-agent-java'

// 让 sample-agent 直接编译本地 adf-core 源码：改了 adf-core 里的类
// （如 DefaultMessageCoordinator）后，./gradlew build 即生效，无需 publish。
includeBuild('../adf-core-java-master') {
  dependencySubstitution {
    substitute module('com.github.roborescue:adf-core-java') using project(':')
  }
}
